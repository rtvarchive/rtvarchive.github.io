<!doctype html>
<html lang="ru">
<script data-goatcounter="https://rtvarchive.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · Сигнал потерян · RADIUS ARCHIVE</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0d14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .error-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 4 / 3;
      margin: 2rem;
      border-radius: 40px;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.9), inset 0 0 100px rgba(0,0,0,0.8);
      background-image: url('../assets/img/404-bg.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .error-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .error-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .error-code {
      font-family: var(--ff-display);
      font-size: clamp(8rem, 15vw, 16rem);
      line-height: 0.8;
      color: rgba(232, 216, 187, 0.95);
      margin: 0;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
      animation: flicker 4s infinite;
    }

    .error-title {
      font-family: var(--ff-mono);
      font-size: clamp(1.2rem, 2.5vw, 2rem);
      color: #e8d8bb;
      background: rgba(11, 13, 20, 0.85);
      padding: 0.5rem 1.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      border-left: 2px solid var(--neon-magenta);
      border-right: 2px solid var(--neon-magenta);
    }

    .error-text {
      font-family: var(--ff-body);
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 3rem;
      background: rgba(11, 13, 20, 0.85);
      padding: 1rem;
      border-radius: 4px;
    }

    .error-btn {
      display: inline-block;
      padding: 1rem 2rem;
      font-family: var(--ff-mono);
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration: none;
      color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
      background: rgba(11, 13, 20, 0.85);
      transition: all 0.25s;
      cursor: pointer;
    }

    .error-btn:hover {
      background: var(--neon-magenta);
      color: #0b0d14;
      box-shadow: 0 0 15px rgba(200, 61, 115, 0.5);
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      3% { opacity: 0.8; }
      6% { opacity: 1; }
      8% { opacity: 0.9; }
      9% { opacity: 1; }
      50% { opacity: 1; }
      52% { opacity: 0.85; }
      54% { opacity: 1; }
    }

    @media (max-width: 700px) {
      .error-container {
        aspect-ratio: auto;
        height: 90vh;
        margin: 1rem;
        border-radius: 20px;
      }
      .error-title {
        font-size: 1rem;
        padding: 0.5rem 1rem;
      }
      .error-text {
        padding: 0 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="error-content">
      <h1 class="error-code">404</h1>
      <div class="error-title">Сигнал потерян</div>
      <p class="error-text">
        Передача, которую вы ищете, была утеряна, стёрта или никогда не существовала в этой реальности.
      </p>
      <a href="index.html" class="error-btn">Вернуться в архив</a>
    </div>
  </div>

</body>
</html>
