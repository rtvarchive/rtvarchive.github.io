name: Playwright Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Генерируем JSON-отчет
    - name: Run Playwright tests
      run: npx playwright test --reporter=json > test-results.json
      continue-on-error: true # Продолжаем, даже если тесты упали

    # Запускаем наш отдельный скрипт
    - name: Generate Signal Status
      if: always()
      run: node generate-status.js

    # Пушим результат
    - name: Commit and Push Signal Status
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add signal-status.json
        git commit -m "Update signal status from CI [skip ci]" || echo "No changes to commit"
        git push

    # Оставляем артефакт
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30