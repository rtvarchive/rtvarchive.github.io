name: Playwright Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --reporter=json > test-results.json
      continue-on-error: true

    - name: Generate Signal Status
      if: always()
      run: node generate-status.js

    # Бот сохраняет результат как артефакт, а НЕ пушит в репозиторий
    - name: Upload Signal Status Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: signal-status
        path: signal-status.json
        retention-days: 5

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30